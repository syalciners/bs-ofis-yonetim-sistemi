name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Gerçek uygulama adresini doğrula
        shell: bash
        run: |
          set -euo pipefail
          URL="https://syalciners.github.io/bs-ofis-yonetim-sistemi/?smoke=${GITHUB_SHA}"
          for i in 1 2 3 4 5 6; do
            HTML="$(curl -fsSL --max-time 20 "$URL" || true)"
            if printf '%s' "$HTML" | grep -q 'BS Ofis Yönetim Sistemi'; then
              echo "Yayın doğrulandı: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Yayın adresi beklenen uygulama HTML'ini döndürmedi."
          exit 1
