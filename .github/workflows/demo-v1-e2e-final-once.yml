name: Demo V1 E2E Final Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-v1-e2e-final-once.yml'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://pparlcdctnivmpiofuvz.supabase.co
      SUPABASE_KEY: sb_publishable__IYAfCCcA6DWnpQ005xJdA__vvdiDGZ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Final A/B izolasyon ve satış talebi testi
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'
          const out={success:false,step:'start',error:null,aId:null,bId:null}
          const save=()=>fs.writeFileSync('.demo-v1-e2e-final.json',JSON.stringify(out,null,2))
          const client=()=>createClient(process.env.SUPABASE_URL,process.env.SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})
          const exact=async(c,t)=>{const r=await c.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count??0}
          try {
            const A=client(); out.step='A auth'; save()
            const aa=await A.auth.signInAnonymously(); if(aa.error)throw aa.error; out.aId=aa.data.user.id
            out.step='A seed'; save()
            const as=await A.rpc('demo_oturum_baslat_v1'); if(as.error)throw as.error; out.aSession=as.data
            const remaining=new Date(as.data.bitis_zamani).getTime()-Date.now(); out.aRemainingMinutes=Math.round(remaining/60000)
            if(remaining<100*60*1000||remaining>121*60*1000)throw new Error(`Demo süresi beklenen 2 saat değil: ${out.aRemainingMinutes} dk`)
            out.step='A initial counts'; save()
            out.aInitial={students:await exact(A,'ogrenciler'),teachers:await exact(A,'ogretmenler'),lessons:await exact(A,'dersler'),collections:await exact(A,'tahsilatlar')}
            if(out.aInitial.students!==18||out.aInitial.teachers!==6||out.aInitial.lessons!==24||out.aInitial.collections!==10)throw new Error(`A başlangıç sayıları hatalı: ${JSON.stringify(out.aInitial)}`)

            const sid=`E2E-A-${Date.now()}`; out.aStudent=sid; out.step='A add student'; save()
            const add=await A.rpc('ogrenci_ekle_guvenli_v1',{p_ogrenci_id:sid,p_ad_soyad:'E2E İzole Öğrenci',p_veli_adi:null,p_veli_telefon:null,p_ogrenci_telefon:null,p_email:null,p_kayit_tarihi:new Date().toISOString().slice(0,10),p_notlar:'Demo V1 final test'}); if(add.error)throw add.error
            out.aStudentsAfter=await exact(A,'ogrenciler'); if(out.aStudentsAfter!==19)throw new Error(`A öğrenci ekleme sayısı ${out.aStudentsAfter}`)

            out.step='A collection'; save()
            const first=await A.from('ogrenciler').select('ogrenci_id').order('ogrenci_id').limit(1).single(); if(first.error)throw first.error
            const tid=`E2E-TAH-${Date.now()}`,khid=`E2E-KH-${Date.now()}`; out.aTahsilat=tid; out.aKasa=khid
            const tah=await A.rpc('tahsilat_kaydet_guvenli_v1',{p_tahsilat_id:tid,p_hareket_id:khid,p_tarih:new Date().toISOString().slice(0,10),p_ogrenci_id:first.data.ogrenci_id,p_tutar:1250,p_odeme_yontemi:'Havale/EFT',p_aciklama:'Demo V1 final izolasyon testi'}); if(tah.error)throw tah.error
            out.aCollectionsAfter=await exact(A,'tahsilatlar'); if(out.aCollectionsAfter!==11)throw new Error(`A tahsilat sayısı ${out.aCollectionsAfter}`)

            out.step='A lead'; save()
            const lead=await A.rpc('demo_teklif_talebi_olustur_v1',{p_ad_soyad:'E2E Test',p_kurum_adi:'E2E Test Kurumu',p_telefon:'05000000000',p_ogrenci_sayisi:50,p_ogretmen_sayisi:5,p_notlar:'Otomatik test - silinecek'}); if(lead.error)throw lead.error; out.leadId=lead.data

            const B=client(); out.step='B auth'; save()
            const ba=await B.auth.signInAnonymously(); if(ba.error)throw ba.error; out.bId=ba.data.user.id
            out.step='B seed'; save()
            const bs=await B.rpc('demo_oturum_baslat_v1'); if(bs.error)throw bs.error; out.bSession=bs.data
            out.step='B isolation'; save()
            out.bInitial={students:await exact(B,'ogrenciler'),collections:await exact(B,'tahsilatlar')}
            const seeS=await B.from('ogrenciler').select('ogrenci_id').eq('ogrenci_id',sid); if(seeS.error)throw seeS.error
            const seeT=await B.from('tahsilatlar').select('tahsilat_id').eq('tahsilat_id',tid); if(seeT.error)throw seeT.error
            out.bSeesAStudent=seeS.data.length; out.bSeesACollection=seeT.data.length
            if(out.bInitial.students!==18||out.bInitial.collections!==10||out.bSeesAStudent!==0||out.bSeesACollection!==0)throw new Error(`B izolasyon hatası: ${JSON.stringify({counts:out.bInitial,s:out.bSeesAStudent,t:out.bSeesACollection})}`)

            out.step='success'; out.success=true; save()
            await A.auth.signOut(); await B.auth.signOut()
          } catch(e) {
            out.error={message:e?.message||String(e),code:e?.code||null,details:e?.details||null,hint:e?.hint||null}; save(); console.error(out.step,out.error); process.exitCode=1
          }
          NODE
          code=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-v1-e2e-final.json
          git commit -m 'Demo V1 final E2E sonucu' || true
          git push origin HEAD:demo-hazirlik
          exit $code
