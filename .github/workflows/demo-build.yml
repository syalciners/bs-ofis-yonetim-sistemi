name: Demo izolasyon ve build doğrulama

on:
  push:
    branches: [demo-hazirlik, demo-satis-audit-odevler-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_demo_placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Geçici Demo Ödevler satış patch'i
        if: github.ref_name == 'demo-satis-audit-odevler-test'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/AssignmentsPage.tsx')
          text = page.read_text()
          old = "import { fullDate, todayISO } from '../lib/format'"
          new = "import { fullDate, todayISO } from '../lib/format'\nimport { APP_MODE } from '../lib/supabase'"
          if text.count(old) != 1: raise SystemExit('AssignmentsPage APP_MODE import eşleşmedi')
          text = text.replace(old, new, 1)
          old = "const{data}=useAppData();const{toast}=useToast();const[searchParams,setSearchParams]=useSearchParams();const driveArchiveEnabled=true;"
          new = "const{data}=useAppData();const{toast}=useToast();const[searchParams,setSearchParams]=useSearchParams();const driveArchiveEnabled=APP_MODE!=='demo';"
          if text.count(old) != 1: raise SystemExit('driveArchiveEnabled eşleşmedi')
          page.write_text(text.replace(old, new, 1))

          form = Path('src/components/AssignmentEditorForm.tsx')
          text = form.read_text()
          old = '''<div className="form-hint"><FileText size={14}/>Ekler önce güvenli depoya alınır, ardından öğrencinin Drive klasörüne arşivlenir.</div>'''
          new = '''<div className="form-hint"><FileText size={14}/>{driveArchiveEnabled?'Ekler önce güvenli depoya alınır, ardından öğrencinin Drive klasörüne arşivlenir.':'Ekler güvenli depoya alınır ve ödev kaydıyla birlikte korunur.'}</div>'''
          if text.count(old) != 1: raise SystemExit('Ödev formu arşiv açıklaması eşleşmedi')
          form.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check:demo-isolation
      - run: npm run check:rules
      - run: npm run build
      - name: Derlenmiş demo paketini artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: bs-egitim-demo-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Derlenmiş demo paketini repo köküne senkronla
        run: node scripts/sync-pages-root.mjs
      - name: Derlenmiş demo paketini doğrula
        run: node scripts/check-published-pages.mjs
      - name: Workflow kimliğini kaydet
        if: github.event_name == 'push'
        run: printf '%s\n' "$GITHUB_RUN_ID" > .demo-build-run-id.txt
      - name: Derlenmiş demo paketini branch'e kaydet
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Derlenmiş demo paketi zaten güncel."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Derlenmiş demo yayın paketini güncelle [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
