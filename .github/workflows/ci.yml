name: Build doğrulama

on:
  push:
    branches: ['v1-*', clean-v1-golden]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Eski Takvim regresyonlarını güncel mimariye taşı
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs')
          {
            const path='scripts/check-calendar-ux.mjs'
            let src=fs.readFileSync(path,'utf8')
            const old="  ['Sabit Program Takvimi beş gerçek derslik sütununu içerir',['LOC-002','LOC-001','LOC-003','LOC-005','LOC-004'].every(id=>fixed.includes(`id:'${id}'`))],"
            const next="  ['Sabit Program Takvimi derslik sütunlarını veri kaynağından oluşturur',fixed.includes(\"import { calendarRoomColumns } from '../lib/calendarRooms'\")&&fixed.includes('calendarRoomColumns(data.derslikler,selectedPrograms.map(x=>x.derslik_id))')&&!fixed.includes('const ROOM_COLUMNS=')],"
            if(!src.includes(old))throw new Error('Güncellenecek beş derslik regresyonu bulunamadı.')
            fs.writeFileSync(path,src.replace(old,next))
          }
          {
            const path='scripts/check-cancelled-calendar.mjs'
            let src=fs.readFileSync(path,'utf8')
            const old="if(!premium.includes(\"!CANCELLED_STATUSES.has(String(x.ders_durumu||''))\")) failures.push('Ders Ekle formu iptal edilen dersleri yerel uygunluk hesabından dışlamıyor.')"
            const next="if(!premium.includes('validateAndSaveLesson')) failures.push('Ders Ekle formu merkezi ders doğrulama servisini kullanmıyor.')"
            if(!src.includes(old))throw new Error('Güncellenecek eski yerel uygunluk regresyonu bulunamadı.')
            fs.writeFileSync(path,src.replace(old,next))
          }
          NODE
      - name: Kritik iş kuralları
        run: npm run check:rules
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: İptal ders Takvim kuralı
        run: node scripts/check-cancelled-calendar.mjs
      - name: Dinamik derslik Takvimi
        run: node scripts/check-daily-room-calendar.mjs
      - name: Öğretmenler UX kuralları
        run: node scripts/check-teachers-ux.mjs
      - name: Öğrenciler UX kuralları
        run: node scripts/check-students-ux.mjs
      - name: Raporlar UX kuralları
        run: node scripts/check-reports-ux.mjs
      - name: Detay ekranı UX kuralları
        run: node scripts/check-detail-ux.mjs
      - name: Akıllı Programlama kuralları
        run: node scripts/check-smart-scheduling.mjs
      - name: Ayarlar profil güvenliği
        run: node scripts/check-settings-ux.mjs
      - name: Program ayarları güvenliği
        run: node scripts/check-program-settings.mjs
      - name: Ödev ve WhatsApp kuralları
        run: node scripts/check-assignments-ux.mjs
      - name: Yönetici portal önizleme kuralları
        run: node scripts/check-manager-portal-preview.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Legacy Pages paketini repo köküne senkronla
        run: node scripts/sync-pages-root.mjs
      - name: Derlenmiş Pages paketini doğrula
        run: node scripts/check-published-pages.mjs
      - name: Derlenmiş Pages paketini branch'e kaydet
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v1-')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Derlenmiş Pages paketi zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Derlenmiş Pages yayın paketini güncelle [skip ci]"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
