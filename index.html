<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>BS Ofis Yönetim Sistemi</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #dbeafe 0%,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #f8fafc 0%,
          #eff6ff 100%
        );

      color: #0f172a;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .giris-karti {
      width: 100%;
      max-width: 430px;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid #e2e8f0;
      border-radius: 24px;

      padding: 42px 36px;

      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.10);
    }

    .logo-alani {
      text-align: center;
      margin-bottom: 34px;
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #2563eb;
      color: white;

      font-size: 27px;
      font-weight: 800;

      box-shadow:
        0 12px 28px rgba(37, 99, 235, 0.28);
    }

    h1 {
      font-size: 25px;
      line-height: 1.25;
      font-weight: 750;
      color: #0f172a;
    }

    .alt-baslik {
      margin-top: 9px;

      font-size: 14px;
      line-height: 1.5;

      color: #64748b;
    }

    .form-grubu {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 650;

      color: #334155;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid #cbd5e1;
      border-radius: 12px;

      background: #ffffff;

      font-size: 16px;
      color: #0f172a;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .sifre-alani {
      position: relative;
    }

    .sifre-alani input {
      padding-right: 72px;
    }

    .sifre-goster {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #2563eb;

      font-size: 13px;
      font-weight: 650;

      cursor: pointer;
    }

    .giris-buton,
    .cikis-buton {
      width: 100%;
      height: 54px;

      margin-top: 6px;

      border: none;
      border-radius: 13px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.2s,
        opacity 0.2s;
    }

    .giris-buton {
      background: #2563eb;
      color: white;

      box-shadow:
        0 10px 24px rgba(37, 99, 235, 0.22);
    }

    .giris-buton:hover {
      background: #1d4ed8;
    }

    .giris-buton:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .giris-buton:active,
    .cikis-buton:active {
      transform: scale(0.99);
    }

    .cikis-buton {
      margin-top: 22px;

      background: #f1f5f9;
      color: #334155;
    }

    .cikis-buton:hover {
      background: #e2e8f0;
    }

    .durum {
      display: none;

      margin-top: 18px;
      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;

      text-align: center;
    }

    .durum.hata {
      display: block;

      background: #fef2f2;
      color: #b91c1c;

      border: 1px solid #fecaca;
    }

    .durum.bilgi {
      display: block;

      background: #eff6ff;
      color: #1d4ed8;

      border: 1px solid #bfdbfe;
    }

    .basari-alani {
      display: none;
      text-align: center;
    }

    .basari-ikon {
      width: 64px;
      height: 64px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #dcfce7;
      color: #15803d;

      font-size: 30px;
      font-weight: 700;
    }

    .basari-baslik {
      font-size: 23px;
      font-weight: 750;

      color: #0f172a;
    }

    .kullanici-adi {
      margin-top: 10px;

      font-size: 17px;
      font-weight: 650;

      color: #2563eb;
    }

    .rol {
      margin-top: 5px;

      font-size: 14px;
      color: #64748b;
    }

    .basari-aciklama {
      margin-top: 20px;
      padding: 14px;

      border-radius: 12px;

      background: #f8fafc;

      font-size: 13px;
      line-height: 1.5;

      color: #475569;
    }

    .alt-bilgi {
      margin-top: 30px;

      text-align: center;

      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .giris-karti {
        padding: 34px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="giris-karti">

    <div
      id="girisAlani"
    >

      <div class="logo-alani">

        <div class="logo">
          BS
        </div>

        <h1>
          BS Ofis Yönetim Sistemi
        </h1>

        <p class="alt-baslik">
          Yönetim paneline erişmek için giriş yapın.
        </p>

      </div>

      <form id="girisFormu">

        <div class="form-grubu">

          <label for="email">
            E-posta
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="E-posta adresiniz"
            required
          >

        </div>

        <div class="form-grubu">

          <label for="sifre">
            Şifre
          </label>

          <div class="sifre-alani">

            <input
              id="sifre"
              type="password"
              autocomplete="current-password"
              placeholder="Şifreniz"
              required
            >

            <button
              class="sifre-goster"
              type="button"
              id="sifreGoster"
            >
              Göster
            </button>

          </div>

        </div>

        <button
          class="giris-buton"
          type="submit"
          id="girisButon"
        >
          Giriş Yap
        </button>

        <div
          class="durum"
          id="durum"
        ></div>

      </form>

    </div>


    <div
      class="basari-alani"
      id="basariAlani"
    >

      <div class="basari-ikon">
        ✓
      </div>

      <div class="basari-baslik">
        Giriş Başarılı
      </div>

      <div
        class="kullanici-adi"
        id="kullaniciAdi"
      ></div>

      <div
        class="rol"
        id="kullaniciRol"
      ></div>

      <div class="basari-aciklama">
        Supabase bağlantısı ve yönetici yetkilendirmesi
        başarıyla doğrulandı.
        <br><br>
        Ana yönetim paneli bir sonraki aşamada
        bu ekrana bağlanacak.
      </div>

      <button
        class="cikis-buton"
        type="button"
        id="cikisButon"
      >
        Çıkış Yap
      </button>

    </div>


    <div class="alt-bilgi">
      BS Ofis • Güvenli Yönetim Paneli
    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    const SUPABASE_URL =
      "https://igmtuouhdozkgwmdxlme.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_scFk1bnw1-VCw_ZQrfc7Mw_N518OvBf";


    const bsSupabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );


    const girisAlani =
      document.getElementById("girisAlani");

    const basariAlani =
      document.getElementById("basariAlani");

    const girisFormu =
      document.getElementById("girisFormu");

    const emailAlani =
      document.getElementById("email");

    const sifreAlani =
      document.getElementById("sifre");

    const sifreGoster =
      document.getElementById("sifreGoster");

    const girisButon =
      document.getElementById("girisButon");

    const durum =
      document.getElementById("durum");

    const kullaniciAdi =
      document.getElementById("kullaniciAdi");

    const kullaniciRol =
      document.getElementById("kullaniciRol");

    const cikisButon =
      document.getElementById("cikisButon");


    function durumGoster(
      mesaj,
      tur = "bilgi"
    ) {

      durum.textContent = mesaj;

      durum.className =
        "durum " + tur;

    }


    function durumTemizle() {

      durum.textContent = "";
      durum.className = "durum";

    }


    function girisEkraniniGoster() {

      basariAlani.style.display = "none";
      girisAlani.style.display = "block";

      sifreAlani.value = "";

      girisButon.disabled = false;
      girisButon.textContent = "Giriş Yap";

    }


    function basariEkraniniGoster(
      profil
    ) {

      girisAlani.style.display = "none";
      basariAlani.style.display = "block";

      kullaniciAdi.textContent =
        profil.ad_soyad;

      kullaniciRol.textContent =
        profil.rol;

    }


    async function kullaniciYetkisiniKontrolEt(
      user
    ) {

      const {
        data,
        error
      } =
        await bsSupabase
          .from("kullanici_profilleri")
          .select(
            "ad_soyad, rol, aktif"
          )
          .eq(
            "auth_user_id",
            user.id
          )
          .single();


      if (error || !data) {

        throw new Error(
          "Bu kullanıcı için geçerli bir BS Ofis profili bulunamadı."
        );

      }


      if (
        data.aktif !== true ||
        data.rol !== "Yönetici"
      ) {

        throw new Error(
          "Bu hesap yönetim paneline erişim yetkisine sahip değil."
        );

      }


      return data;

    }


    async function oturumuDogrula(
      user
    ) {

      try {

        const profil =
          await kullaniciYetkisiniKontrolEt(
            user
          );

        durumTemizle();

        basariEkraniniGoster(
          profil
        );

      } catch (error) {

        await bsSupabase.auth.signOut();

        girisEkraniniGoster();

        durumGoster(
          error.message,
          "hata"
        );

      }

    }


    sifreGoster.addEventListener(
      "click",
      function () {

        if (
          sifreAlani.type === "password"
        ) {

          sifreAlani.type = "text";

          sifreGoster.textContent =
            "Gizle";

        } else {

          sifreAlani.type = "password";

          sifreGoster.textContent =
            "Göster";

        }

      }
    );


    girisFormu.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        durumTemizle();

        const email =
          emailAlani.value
            .trim()
            .toLowerCase();

        const password =
          sifreAlani.value;


        girisButon.disabled = true;

        girisButon.textContent =
          "Giriş yapılıyor...";


        const {
          data,
          error
        } =
          await bsSupabase.auth
            .signInWithPassword({
              email: email,
              password: password
            });


        if (error) {

          girisButon.disabled = false;

          girisButon.textContent =
            "Giriş Yap";


          let mesaj =
            "Giriş yapılamadı. Lütfen bilgilerinizi kontrol edin.";


          if (
            error.message
              .toLowerCase()
              .includes("invalid login")
          ) {

            mesaj =
              "E-posta veya şifre hatalı.";

          }


          if (
            error.message
              .toLowerCase()
              .includes("email not confirmed")
          ) {

            mesaj =
              "E-posta hesabı henüz doğrulanmamış.";

          }


          durumGoster(
            mesaj,
            "hata"
          );

          return;

        }


        if (
          !data ||
          !data.user
        ) {

          girisButon.disabled = false;

          girisButon.textContent =
            "Giriş Yap";

          durumGoster(
            "Kullanıcı oturumu oluşturulamadı.",
            "hata"
          );

          return;

        }


        await oturumuDogrula(
          data.user
        );

      }
    );


    cikisButon.addEventListener(
      "click",
      async function () {

        await bsSupabase.auth.signOut();

        girisEkraniniGoster();

        durumTemizle();

      }
    );


    async function mevcutOturumuKontrolEt() {

      const {
        data,
        error
      } =
        await bsSupabase.auth
          .getSession();


      if (
        error ||
        !data ||
        !data.session ||
        !data.session.user
      ) {

        girisEkraniniGoster();

        return;

      }


      await oturumuDogrula(
        data.session.user
      );

    }


    mevcutOturumuKontrolEt();

  </script>

</body>
</html>
