name: Demo V1 Verify Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-v1-verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_demo_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Kontroller
        id: checks
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund
          install=$?
          npm run check:demo-isolation
          isolation=$?
          npm run check:rules
          rules=$?
          npm run build
          build=$?
          printf 'install=%s\nisolation=%s\nrules=%s\nbuild=%s\n' "$install" "$isolation" "$rules" "$build" > .demo-v1-verify-result.txt
          if [ "$install" -ne 0 ] || [ "$isolation" -ne 0 ] || [ "$rules" -ne 0 ] || [ "$build" -ne 0 ]; then exit 1; fi
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-v1-verify-result.txt
          git commit -m 'Demo V1 doğrulama sonucu' || true
          git push origin HEAD:demo-hazirlik
