name: Build doğrulama

on:
  push:
    branches: ['v1-*', clean-v1-golden]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kritik iş kuralları
        run: npm run check:rules
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: Öğretmenler UX kuralları
        run: node scripts/check-teachers-ux.mjs
      - name: Akıllı Programlama kuralları
        run: node scripts/check-smart-scheduling.mjs
      - name: Ayarlar profil güvenliği
        run: node scripts/check-settings-ux.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/manifest.webmanifest
