name: Geçici sabit program sürükle-bırak patch

"on":
  push:
    branches:
      - v1-sabit-program-surukle-tasi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-sabit-program-surukle-tasi
          fetch-depth: 0
      - name: Sabit program Takvim sürükle-bırak kodunu uygula
        run: python3 scripts/temp_patch_fixed_drag.py
      - name: Hızlı regresyon kontrolleri
        run: |
          node scripts/check-smart-scheduling.mjs
          node scripts/check-daily-room-calendar.mjs
      - name: Değişiklikleri commit et
        run: |
          git config user.name "syalciners"
          git config user.email "syalciners@gmail.com"
          git add src/pages/FixedProgramPage.tsx scripts/check-smart-scheduling.mjs
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Sabit program Takvimine güvenli sürükle-bırak ekle"
          git push origin HEAD:v1-sabit-program-surukle-tasi
