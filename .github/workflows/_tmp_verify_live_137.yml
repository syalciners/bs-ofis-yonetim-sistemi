name: PR 137 canlı yayın doğrulama

on:
  push:
    branches: [verify-live-137]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Main workflow ve Pages yayını doğrula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: 095472ca64a88495d42884cce394887c4345e50a
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          RUN_ID=""
          RUN_STATUS=""
          RUN_RESULT=""
          for i in $(seq 1 36); do
            RUN_JSON="$(curl -fsSL "${AUTH[@]}" "${API}/actions/workflows/deploy-pages.yml/runs?branch=main&event=push&per_page=20")"
            RUN_ID="$(printf '%s' "$RUN_JSON" | jq -r --arg sha "$TARGET" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -n1)"
            RUN_STATUS="$(printf '%s' "$RUN_JSON" | jq -r --arg sha "$TARGET" '.workflow_runs[] | select(.head_sha==$sha) | .status' | head -n1)"
            RUN_RESULT="$(printf '%s' "$RUN_JSON" | jq -r --arg sha "$TARGET" '.workflow_runs[] | select(.head_sha==$sha) | .conclusion' | head -n1)"
            if [[ -n "$RUN_ID" && "$RUN_STATUS" == "completed" ]]; then
              [[ "$RUN_RESULT" == "success" ]] || { echo "Main canlı doğrulama başarısız: $RUN_RESULT"; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$RUN_ID" && "$RUN_STATUS" == "completed" && "$RUN_RESULT" == "success" ]] || { echo "Main canlı workflow doğrulanamadı"; exit 1; }

          PAGES_STATUS=""
          PAGE_COMMIT=""
          for i in $(seq 1 36); do
            PAGE_JSON="$(curl -fsSL "${AUTH[@]}" "${API}/pages/builds/latest")"
            PAGE_COMMIT="$(printf '%s' "$PAGE_JSON" | jq -r '.commit')"
            PAGES_STATUS="$(printf '%s' "$PAGE_JSON" | jq -r '.status')"
            if [[ "$PAGE_COMMIT" == "$TARGET" && "$PAGES_STATUS" == "built" ]]; then break; fi
            sleep 5
          done
          [[ "$PAGES_STATUS" == "built" && "$PAGE_COMMIT" == "$TARGET" ]] || { echo "Pages doğrulanamadı: $PAGES_STATUS $PAGE_COMMIT"; exit 1; }

          LIVE_OK="false"
          for i in $(seq 1 36); do
            HTML="$(curl -fsSL --max-time 20 "https://syalciners.github.io/bs-ofis-yonetim-sistemi/?verify=${TARGET}" || true)"
            JS_PATH="$(printf '%s' "$HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -n1 || true)"
            if [[ -n "$JS_PATH" ]]; then
              curl -fsSL --max-time 30 "https://syalciners.github.io/bs-ofis-yonetim-sistemi/${JS_PATH}?verify=${TARGET}" -o /tmp/live-app.js || true
              if [[ -s /tmp/live-app.js ]] && grep -Fq '/portal-onizleme/ogretmen' /tmp/live-app.js && grep -Fq '/portal-onizleme/ogrenci' /tmp/live-app.js; then LIVE_OK="true"; break; fi
            fi
            sleep 5
          done
          [[ "$LIVE_OK" == "true" ]] || { echo "Canlı JS yeni portal route'larını içermiyor"; exit 1; }
          echo "LIVE_OK $TARGET MAIN_RUN=$RUN_ID PAGES=$PAGES_STATUS PORTAL_ROUTES=teacher+student"
          printf 'LIVE_OK %s\nMAIN_RUN %s success\nPAGES %s %s\nPORTAL_ROUTES teacher+student\n' "$TARGET" "$RUN_ID" "$PAGES_STATUS" "$PAGE_COMMIT" > scripts/_tmp_live_137.txt
      - name: Doğrulama sonucunu branch'e yaz
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add scripts/_tmp_live_137.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PR 137 canlı doğrulama başarılı [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
