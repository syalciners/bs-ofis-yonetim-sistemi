name: BS Eğitim Portalı build doğrulama

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/bs-egitim-portali/**'
      - '.github/workflows/bs-egitim-portali-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://saas-portal-env-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_saas_portal_env_test_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portal bağımlılıklarını kur
        working-directory: apps/bs-egitim-portali
        run: npm install --no-audit --no-fund
      - name: Eksik portal instance env reddediliyor
        working-directory: apps/bs-egitim-portali
        shell: bash
        run: |
          set +e
          VITE_SUPABASE_URL='' VITE_SUPABASE_PUBLISHABLE_KEY='' npm run check:instance-config >/tmp/portal-missing-env.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0 || { echo "::error::Eksik portal env doğrulaması beklenmedik şekilde başarılı oldu."; exit 1; }
          grep -F -q 'VITE_SUPABASE_URL' /tmp/portal-missing-env.log || { cat /tmp/portal-missing-env.log; exit 1; }
          echo "Eksik portal instance env güvenli biçimde reddediliyor."
      - name: Gerçek portal build doğrulaması
        working-directory: apps/bs-egitim-portali
        run: npm run build
      - name: İzole tasarım önizlemesini derle
        working-directory: apps/bs-egitim-portali
        env:
          VITE_PORTAL_DESIGN_PREVIEW: 'true'
          VITE_BASE_PATH: '/bs-ofis-yonetim-sistemi/portal-preview/'
        run: npm run build
      - name: GitHub Pages önizleme paketini hazırla
        run: |
          rm -rf portal-preview
          mkdir -p portal-preview
          cp -R apps/bs-egitim-portali/dist/. portal-preview/
      - name: Test branch'ine portal paketi yazma kapalı
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          git add portal-preview
          if git diff --cached --quiet; then
            echo "Portal önizleme paketi zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Portal görsel önizleme paketini güncelle [skip ci]"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
