name: Geçici kurum raporu semantik patch

on:
  push:
    branches:
      - v1-kurum-ogrenci-bakiyesi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-kurum-ogrenci-bakiyesi
          fetch-depth: 0
      - name: Kurum raporu etiketlerini ve ders birimini düzelt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          report = Path('src/pages/ReportsPage.tsx')
          text = report.read_text()
          text = text.replace('<span>Öğrenci Alacağı</span>', '<span>Öğrenci Bakiyesi</span>')
          text = text.replace(
              '<b>{completedInstitutionLessons.length}</b>',
              '<b>{completedInstitutionLessons.reduce((sum, x) => sum + Number(x.ders_sayisi || 1), 0)}</b>',
          )
          text = text.replace(
              'Ders Durumu Dağılımı <span className="report-section-note">operasyon kalitesi</span>',
              'Program Durumu Dağılımı <span className="report-section-note">operasyon kalitesi</span>',
          )
          text = text.replace(
              'completedLessons: completedLessonsForPdf.length,',
              'completedLessons: completedLessonsForPdf.reduce((sum, x) => sum + Number(x.ders_sayisi || 1), 0),',
          )
          report.write_text(text)

          pdf = Path('src/services/institutionManagementPdfService.ts')
          text = pdf.read_text()
          text = text.replace("metric('Öğrenci Alacağı',money(input.openStudentDebt)", "metric('Öğrenci Bakiyesi',money(input.openStudentDebt)")
          text = text.replace("{text:[{text:'Ders Durumu Dağılımı'", "{text:[{text:'Program Durumu Dağılımı'")
          pdf.write_text(text)

          test = Path('scripts/check-reports-ux.mjs')
          text = test.read_text()
          text = text.replace("reports.includes('Öğrenci Alacağı')", "reports.includes('Öğrenci Bakiyesi')")
          text = text.replace("institutionPdf.includes('Öğrenci Alacağı')", "institutionPdf.includes('Öğrenci Bakiyesi')")
          text = text.replace("institutionPdf.includes('Ders Durumu Dağılımı')", "institutionPdf.includes('Program Durumu Dağılımı')")
          anchor = "  ['Kurum PDF finansal durum ve ders dağılımını korur',"
          check = "  ['Kurum yapılan ders KPI gerçek ders_sayisi toplamıdır', reports.includes('completedInstitutionLessons.reduce((sum, x) => sum + Number(x.ders_sayisi || 1), 0)') && reports.includes('completedLessons: completedLessonsForPdf.reduce((sum, x) => sum + Number(x.ders_sayisi || 1), 0)')],\n"
          if 'Kurum yapılan ders KPI gerçek ders_sayisi toplamıdır' not in text:
              text = text.replace(anchor, check + anchor)
          test.write_text(text)
          PY
      - name: Patch'i commit et
        shell: bash
        run: |
          git config user.name "syalciners"
          git config user.email "syalciners@gmail.com"
          git add src/pages/ReportsPage.tsx src/services/institutionManagementPdfService.ts scripts/check-reports-ux.mjs
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Kurum raporu öğrenci bakiyesi ve ders birimini düzelt"
          git push origin HEAD:v1-kurum-ogrenci-bakiyesi
