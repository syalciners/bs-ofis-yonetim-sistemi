name: Demo Brand Package V2 Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-brand-package-v2-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://pparlcdctnivmpiofuvz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__IYAfCCcA6DWnpQ005xJdA__vvdiDGZ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - id: isolation
        continue-on-error: true
        run: npm run check:demo-isolation
      - id: rules
        continue-on-error: true
        run: npm run check:rules
      - id: build
        continue-on-error: true
        run: npm run build
      - id: assets
        continue-on-error: true
        name: Marka varlıklarını doğrula
        run: |
          test -s dist/bs-logo.png
          test -s dist/bs-egitim-icon-192-v2.png
          test -s dist/bs-egitim-icon-512-v2.png
          test -s dist/bs-icon-maskable-512.png
          file dist/bs-logo.png | grep -q 'PNG image data'
          file dist/bs-egitim-icon-192-v2.png | grep -q '192 x 192'
          file dist/bs-egitim-icon-512-v2.png | grep -q '512 x 512'
          file dist/bs-icon-maskable-512.png | grep -q '512 x 512'
      - name: Artifact yükle
        if: steps.install.outcome == 'success' && steps.isolation.outcome == 'success' && steps.rules.outcome == 'success' && steps.build.outcome == 'success' && steps.assets.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bs-egitim-demo-brand-dist-v2
          path: dist/
          if-no-files-found: error
      - name: Sonucu ve run ID'yi kaydet
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          ISOLATION: ${{ steps.isolation.outcome }}
          RULES: ${{ steps.rules.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          printf 'install=%s\nisolation=%s\nrules=%s\nbuild=%s\nassets=%s\nrun_id=%s\nsource_commit=%s\n' "$INSTALL" "$ISOLATION" "$RULES" "$BUILD" "$ASSETS" "$GITHUB_RUN_ID" "$GITHUB_SHA" > .demo-brand-package-v2-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-brand-package-v2-result.txt
          git commit -m 'Demo marka V2 paket sonucunu kaydet' || true
          git push origin HEAD:demo-hazirlik
      - name: Tüm kapıları zorunlu tut
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          ISOLATION: ${{ steps.isolation.outcome }}
          RULES: ${{ steps.rules.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          test "$INSTALL" = success
          test "$ISOLATION" = success
          test "$RULES" = success
          test "$BUILD" = success
          test "$ASSETS" = success
