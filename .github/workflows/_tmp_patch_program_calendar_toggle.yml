name: Geçici Program Takvim görünüm patch

on:
  push:
    branches:
      - v1-program-takvim-tek-gecis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-program-takvim-tek-gecis
          fetch-depth: 0
      - name: Patch uygula
        run: python3 scripts/_tmp_patch_program_calendar_toggle.py
      - name: Değişiklikleri kaydet
        run: |
          if git diff --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DailyCalendarPage.tsx src/daily-calendar.css scripts/check-calendar-ux.mjs
          git commit -m "Program Takvim görünüm geçişini tek butonda birleştir"
          git push origin HEAD:v1-program-takvim-tek-gecis
