name: Demo izolasyon ve build doğrulama

on:
  push:
    branches: [demo-hazirlik]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_demo_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check:demo-isolation
      - run: npm run check:rules
      - run: npm run build
