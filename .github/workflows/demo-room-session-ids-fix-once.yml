name: Demo Room Session IDs Fix Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-room-session-ids-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://demo-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_demo_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derslik kimliklerini veri kaynağından üret
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[Path('src/pages/DailyCalendarPage.tsx'),Path('src/pages/FixedProgramPage.tsx')]
          const_pat=re.compile(r"\nconst ROOM_COLUMNS=\[\n(?:\s*\{id:'LOC-\d+'\},\n)+\] as const\n")
          map_pat=re.compile(r"const roomColumns=ROOM_COLUMNS\.map\(column=>\{\s*const room=data\.derslikler\.find\(x=>x\.derslik_id===column\.id\)\s*return\{\.\.\.column,room,label:room\?\.mekan_adi\|\|'Derslik'\}\s*\}\)")
          new_map="""const roomColumns=[...data.derslikler]
            .filter(room=>room.aktif!==false)
            .sort((a,b)=>{
              const aOnline=String(a.mekan_turu||'').toLocaleLowerCase('tr-TR')==='online'?1:0
              const bOnline=String(b.mekan_turu||'').toLocaleLowerCase('tr-TR')==='online'?1:0
              return aOnline-bOnline||String(a.derslik_id).localeCompare(String(b.derslik_id),'tr-TR')
            })
            .map(room=>({id:room.derslik_id,room,label:room.mekan_adi||'Derslik'}))"""
          for p in paths:
              s=p.read_text()
              s,n1=const_pat.subn('\n',s,count=1)
              s,n2=map_pat.subn(new_map,s,count=1)
              if n1!=1 or n2!=1:
                  raise SystemExit(f'{p}: beklenen blok bulunamadı const={n1} map={n2}')
              if "LOC-001" in s or "ROOM_COLUMNS" in s:
                  raise SystemExit(f'{p}: sabit derslik kimliği kaldı')
              p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check:demo-isolation
      - run: npm run check:rules
      - run: npm run build
      - name: Değişikliği commit et
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/DailyCalendarPage.tsx src/pages/FixedProgramPage.tsx
          git commit -m 'Demo derslik kimliklerini oturuma göre dinamik yap'
          git push origin HEAD:demo-hazirlik
