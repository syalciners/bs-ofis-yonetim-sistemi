name: Demo Brand Package Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-brand-package-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: demo
      VITE_SUPABASE_URL: https://pparlcdctnivmpiofuvz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__IYAfCCcA6DWnpQ005xJdA__vvdiDGZ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:demo-isolation
      - run: npm run check:rules
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bs-egitim-demo-brand-dist
          path: dist/
          if-no-files-found: error
      - name: Run ID kaydet
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .demo-brand-package-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-brand-package-run-id.txt
          git commit -m 'Demo marka paket run id kaydet' || true
          git push origin HEAD:demo-hazirlik
