name: Geçici canlı Pages doğrulama

on:
  push:
    branches: ['v1-program-ust-yapi-standart']
    paths-ignore:
      - 'scripts/_tmp_pages_live_ok.txt'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Pages build durumunu doğrula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1f01afe7e8b1c0fc8cea0ef8059df25d47e377a7
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            commit=$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))')
            echo "Pages: status=$status commit=$commit"
            if [ "$status" = "built" ] && [ "$commit" = "$TARGET_SHA" ]; then
              printf 'BUILT %s\n' "$commit" > scripts/_tmp_pages_live_ok.txt
              exit 0
            fi
            sleep 5
          done
          echo "Hedef commit için Pages built durumu doğrulanamadı." >&2
          exit 1
      - name: Başarı işaretini branch'e kaydet
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/_tmp_pages_live_ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canlı Pages doğrulaması başarılı [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
