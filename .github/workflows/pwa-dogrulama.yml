name: PWA Dogrulama

on:
  push:
    branches: [main, muzik-dans-v1-gelistirme]
    paths:
      - 'servisler/**.js'
      - 'moduller/**.js'
      - 'operasyon-test.html'
      - 'kurs-test.html'
      - 'operasyon-test-sw.js'
      - '.github/workflows/pwa-dogrulama.yml'
  workflow_dispatch:

jobs:
  javascript-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Servis ve modulleri kontrol et
        shell: bash
        run: |
          set -euo pipefail
          find servisler moduller -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "Kontrol: $f"
            node --check "$f"
          done
          node --check operasyon-test-sw.js
      - name: Test kabuklarinin scriptlerini kontrol et
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          for dosya in ('operasyon-test.html', 'kurs-test.html'):
              text = Path(dosya).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
              if not scripts:
                  raise SystemExit(f'{dosya} icinde inline script bulunamadi')
              for i, script in enumerate(scripts):
                  p = Path(tempfile.gettempdir()) / f'{Path(dosya).stem}-inline-{i}.js'
                  p.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
              print(f'{dosya}: inline script kontrolu basarili')
