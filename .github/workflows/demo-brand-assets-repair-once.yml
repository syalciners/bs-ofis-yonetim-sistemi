name: Demo Brand Assets Repair Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-brand-assets-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - name: Doğrulanmış PNG dosyalarını üret
        run: |
          base64 -d .brand-source/bs-logo.b64 > public/bs-logo.png
          base64 -d .brand-source/bs-icon-192.b64 > public/bs-egitim-icon-192-v2.png
          cp public/bs-egitim-icon-192-v2.png public/bs-app-icon-192.png
          base64 -d .brand-source/bs-icon-512.b64 > public/bs-egitim-icon-512-v2.png
          cp public/bs-egitim-icon-512-v2.png public/bs-app-icon-512.png
          base64 -d .brand-source/bs-icon-maskable-512.b64 > public/bs-icon-maskable-512.png
      - name: SHA-256 ve PNG doğrulaması
        run: |
          echo 'bffa501826a9bbfb16c2e31e8cb1caeea08689943bec327b99e64e07b2ba2f08  public/bs-logo.png' | sha256sum -c -
          echo 'cf9b7f6d5b6d39e14a0aca850b3bf4aa2dc686c0a69a8cc2ac95801e81237d83  public/bs-egitim-icon-192-v2.png' | sha256sum -c -
          echo 'f177f58ad625d60415435625346a64283be2ab2d6948b21767a4466af941007f  public/bs-egitim-icon-512-v2.png' | sha256sum -c -
          echo 'd19212372d89afdca50ec961c88315d7ad4beb94ca221798c357dd5349085d94  public/bs-icon-maskable-512.png' | sha256sum -c -
          file public/bs-logo.png | grep -q 'PNG image data'
          file public/bs-egitim-icon-192-v2.png | grep -q '192 x 192'
          file public/bs-egitim-icon-512-v2.png | grep -q '512 x 512'
          file public/bs-icon-maskable-512.png | grep -q '512 x 512'
      - name: Binary varlıkları branch'e commit et
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bs-logo.png public/bs-egitim-icon-192-v2.png public/bs-app-icon-192.png public/bs-egitim-icon-512-v2.png public/bs-app-icon-512.png public/bs-icon-maskable-512.png
          git commit -m 'Demo marka PNG varlıklarını SHA doğrulamasıyla onar' || true
          git push origin HEAD:demo-hazirlik
      - name: Sonucu kaydet
        run: |
          printf 'status=success\nrun_id=%s\n' "$GITHUB_RUN_ID" > .demo-brand-assets-repair-result.txt
          git add .demo-brand-assets-repair-result.txt
          git commit -m 'Demo marka varlık onarım sonucunu kaydet' || true
          git push origin HEAD:demo-hazirlik
