name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Kritik iş kuralları
        run: npm run check:rules
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: İptal ders Takvim kuralı
        run: node scripts/check-cancelled-calendar.mjs
      - name: Beş sütunlu derslik Takvimi
        run: node scripts/check-daily-room-calendar.mjs
      - name: Öğretmenler UX kuralları
        run: node scripts/check-teachers-ux.mjs
      - name: Öğrenciler UX kuralları
        run: node scripts/check-students-ux.mjs
      - name: Detay ekranı UX kuralları
        run: node scripts/check-detail-ux.mjs
      - name: Akıllı Programlama kuralları
        run: node scripts/check-smart-scheduling.mjs
      - name: Ayarlar profil güvenliği
        run: node scripts/check-settings-ux.mjs
      - name: Ödev ve WhatsApp kuralları
        run: node scripts/check-assignments-ux.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Gerçek derlenmiş uygulama adresini doğrula
        shell: bash
        run: |
          set -euo pipefail
          URL="https://syalciners.github.io/bs-ofis-yonetim-sistemi/?smoke=${GITHUB_SHA}"
          for i in 1 2 3 4 5 6; do
            HTML="$(curl -fsSL --max-time 20 "$URL" || true)"
            if printf '%s' "$HTML" | grep -q 'BS Eğitim Yönetimi' \
              && printf '%s' "$HTML" | grep -Eq 'assets/index-[A-Za-z0-9_-]+\.js' \
              && ! printf '%s' "$HTML" | grep -q 'src/main.tsx'; then
              MANIFEST="$(curl -fsSL --max-time 20 "https://syalciners.github.io/bs-ofis-yonetim-sistemi/manifest.webmanifest?smoke=${GITHUB_SHA}" || true)"
              if printf '%s' "$MANIFEST" | grep -q 'BS Eğitim Yönetimi'; then
                echo "Derlenmiş React/PWA yayını doğrulandı: $URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Yayın adresi derlenmiş React/PWA paketini döndürmedi."
          exit 1
