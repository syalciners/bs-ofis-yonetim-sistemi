name: Geçici sabit program TypeScript düzeltmesi

"on":
  push:
    branches:
      - v1-sabit-program-surukle-tasi

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-sabit-program-surukle-tasi
          fetch-depth: 0
      - name: Null güvenliği düzeltmesini uygula
        run: python3 scripts/temp_fix_fixed_drag_ts.py
      - name: Akıllı Programlama kontrolü
        run: node scripts/check-smart-scheduling.mjs
      - name: Düzeltmeyi commit et
        run: |
          git config user.name "syalciners"
          git config user.email "syalciners@gmail.com"
          git add src/pages/FixedProgramPage.tsx
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Sabit program sürükleme null güvenliğini düzelt"
          git push origin HEAD:v1-sabit-program-surukle-tasi
