name: Portal CI

on:
  push:
    branches: [portal-v1-gelistirme, portal-v1-deploy]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bağımlılıkları kur
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Portalı derle
        run: npm run build
      - name: Paket kilidini branch'e sabitle
        if: github.event_name == 'push' && github.ref_name == 'portal-v1-gelistirme'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Portal paket kilidini sabitle"
            git push
          fi
      - name: Lock dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: portal-package-lock
          path: portal/package-lock.json
          if-no-files-found: error
      - name: Portal dağıtım çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist
          if-no-files-found: error
