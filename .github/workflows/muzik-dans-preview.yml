name: Müzik Dans Preview Deploy

on:
  push:
    branches: [muzik-dans-demo-v1]
    paths:
      - .muzik-dans-preview-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_3m9L8toJmRGCAENDwfPFTUJq
      VERCEL_PROJECT_ID: prj_SU2C3RE5lTS56EnSJT8hp7skicr0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MD_SUPABASE_URL: https://igmtuouhdozkgwmdxlme.supabase.co
      MD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_scFk1bnw1-VCw_ZQrfc7Mw_N518OvBf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vercel hedefini doğrula
        id: project_guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN boş."; exit 1; }
          STATUS="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          test "$STATUS" = "200" || { echo "::error::Vercel proje erişimi HTTP $STATUS."; exit 1; }
          node <<'NODE'
          const fs = require('fs')
          const j = JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'))
          if (j.id !== process.env.VERCEL_PROJECT_ID || j.name !== 'bs-test-studio') {
            console.error('GÜVENLİK ENGELİ: Hedef boş bs-test-studio preview projesi değil.')
            process.exit(1)
          }
          console.log(`Hedef doğrulandı: ${j.name} / ${j.id}`)
          NODE

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Müzik Dans production build
        id: build
        env:
          VITE_APP_MODE: live
          VITE_PRODUCT_PROFILE: muzik-dans
          VITE_SUPABASE_URL: ${{ env.MD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.MD_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Dist güvenlik kontrolü
        id: artifact_guard
        shell: bash
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::dist oluşmadı."; exit 1; }
          grep -R -F -q "$MD_SUPABASE_URL" dist || { echo "::error::Müzik & Dans Supabase URL dist içinde bulunamadı."; exit 1; }
          if grep -R -F -q "pparlcdctnivmpiofuvz.supabase.co" dist; then
            echo "::error::BS Eğitim Demo Supabase URL'si Müzik & Dans dist içine sızdı."
            exit 1
          fi
          grep -R -F -q "BS Müzik & Dans Yönetimi" dist || { echo "::error::Müzik & Dans ürün kimliği dist içinde bulunamadı."; exit 1; }
          echo "Müzik & Dans dist doğrulandı."

      - name: Vercel CLI kur
        run: npm install --global vercel@latest

      - name: Ayrı preview deploy et
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '%s' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          PREVIEW_URL="$(vercel deploy dist --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview oluşturuldu: $PREVIEW_URL"

      - name: Preview sonucunu kaydet
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PROJECT_OUTCOME: ${{ steps.project_guard.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact_guard.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > .muzik-dans-preview-result.txt <<EOF
          run_id=$GITHUB_RUN_ID
          job_status=$JOB_STATUS
          project_guard=$PROJECT_OUTCOME
          build=$BUILD_OUTCOME
          artifact_guard=$ARTIFACT_OUTCOME
          deploy=$DEPLOY_OUTCOME
          preview_url=${PREVIEW_URL:-}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .muzik-dans-preview-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Müzik & Dans preview sonucunu kaydet [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
