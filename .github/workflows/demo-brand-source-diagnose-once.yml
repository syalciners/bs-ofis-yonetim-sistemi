name: Demo Brand Source Diagnose Once

on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-brand-source-diagnose-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - name: Kaynakları ayrı ayrı doğrula
        run: |
          : > .demo-brand-source-diagnose-result.txt
          for item in \
            'logo .brand-source/bs-logo.b64' \
            'icon192 .brand-source/bs-icon-192.b64' \
            'icon512 .brand-source/bs-icon-512.b64' \
            'mask512 .brand-source/bs-icon-maskable-512.b64'
          do
            set -- $item
            name="$1"; src="$2"; out="/tmp/$name.png"
            if base64 -d "$src" > "$out" 2>/tmp/${name}.err; then
              printf '%s_decode=success\n' "$name" >> .demo-brand-source-diagnose-result.txt
              printf '%s_sha=%s\n' "$name" "$(sha256sum "$out" | awk '{print $1}')" >> .demo-brand-source-diagnose-result.txt
              printf '%s_size=%s\n' "$name" "$(stat -c%s "$out")" >> .demo-brand-source-diagnose-result.txt
            else
              printf '%s_decode=failure\n' "$name" >> .demo-brand-source-diagnose-result.txt
              printf '%s_error=%s\n' "$name" "$(tr '\n' ' ' </tmp/${name}.err)" >> .demo-brand-source-diagnose-result.txt
            fi
          done
      - name: Sonucu branch'e yaz
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-brand-source-diagnose-result.txt
          git commit -m 'Demo marka kaynak teşhis sonucunu kaydet' || true
          git push origin HEAD:demo-hazirlik
