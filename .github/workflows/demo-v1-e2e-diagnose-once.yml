name: Demo V1 E2E Diagnose Once

# rerun: seed order fixed
on:
  push:
    branches: [demo-hazirlik]
    paths:
      - '.github/workflows/demo-v1-e2e-diagnose-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://pparlcdctnivmpiofuvz.supabase.co
      SUPABASE_KEY: sb_publishable__IYAfCCcA6DWnpQ005xJdA__vvdiDGZ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-hazirlik
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Teşhisli E2E
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'
          const out={success:false,step:'start',error:null,aId:null,bId:null}
          const save=()=>fs.writeFileSync('.demo-v1-e2e-diagnose.json',JSON.stringify(out,null,2))
          const client=()=>createClient(process.env.SUPABASE_URL,process.env.SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})
          const exact=async(c,t)=>{const r=await c.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count??0}
          try{
            const A=client(); out.step='A anonymous sign-in'; save()
            const aa=await A.auth.signInAnonymously(); if(aa.error)throw aa.error; out.aId=aa.data.user.id
            out.step='A demo session seed'; save()
            const as=await A.rpc('demo_oturum_baslat_v1'); if(as.error)throw as.error; out.aSession=as.data
            out.step='A count'; save(); out.aStudents=await exact(A,'ogrenciler'); out.aTeachers=await exact(A,'ogretmenler'); out.aLessons=await exact(A,'dersler'); out.aCollections=await exact(A,'tahsilatlar')
            if(out.aStudents!==18||out.aTeachers!==6||out.aLessons!==24||out.aCollections!==10)throw new Error(`A counts unexpected ${out.aStudents}/${out.aTeachers}/${out.aLessons}/${out.aCollections}`)
            const sid=`E2E-A-${Date.now()}`; out.aStudent=sid
            out.step='A add student'; save()
            const add=await A.rpc('ogrenci_ekle_guvenli_v1',{p_ogrenci_id:sid,p_ad_soyad:'E2E İzole Öğrenci',p_veli_adi:null,p_veli_telefon:null,p_ogrenci_telefon:null,p_email:null,p_kayit_tarihi:new Date().toISOString().slice(0,10),p_notlar:'Demo izolasyon testi'}); if(add.error)throw add.error
            out.aStudentsAfter=await exact(A,'ogrenciler'); if(out.aStudentsAfter!==19)throw new Error(`A add count ${out.aStudentsAfter}`)
            out.step='A collection'; save()
            const first=await A.from('ogrenciler').select('ogrenci_id').order('ogrenci_id').limit(1).single();if(first.error)throw first.error
            const tid=`E2E-TAH-${Date.now()}`,khid=`E2E-KH-${Date.now()}`;out.aTahsilat=tid;out.aKasa=khid
            const tah=await A.rpc('tahsilat_kaydet_guvenli_v1',{p_tahsilat_id:tid,p_hareket_id:khid,p_tarih:new Date().toISOString().slice(0,10),p_ogrenci_id:first.data.ogrenci_id,p_tutar:1250,p_odeme_yontemi:'Havale',p_aciklama:'E2E izolasyon testi'});if(tah.error)throw tah.error
            out.aCollectionsAfter=await exact(A,'tahsilatlar'); if(out.aCollectionsAfter!==11)throw new Error(`A collection count ${out.aCollectionsAfter}`)
            const B=client(); out.step='B anonymous sign-in'; save()
            const ba=await B.auth.signInAnonymously();if(ba.error)throw ba.error;out.bId=ba.data.user.id
            out.step='B demo session seed';save()
            const bs=await B.rpc('demo_oturum_baslat_v1');if(bs.error)throw bs.error;out.bSession=bs.data
            out.step='B isolation counts';save();out.bStudents=await exact(B,'ogrenciler');out.bCollections=await exact(B,'tahsilatlar')
            const seeS=await B.from('ogrenciler').select('ogrenci_id').eq('ogrenci_id',sid);if(seeS.error)throw seeS.error;out.bSeesAStudent=seeS.data.length
            const seeT=await B.from('tahsilatlar').select('tahsilat_id').eq('tahsilat_id',tid);if(seeT.error)throw seeT.error;out.bSeesATahsilat=seeT.data.length
            if(out.bStudents!==18||out.bCollections!==10||out.bSeesAStudent!==0||out.bSeesATahsilat!==0)throw new Error(`B isolation failed ${out.bStudents}/${out.bCollections}/${out.bSeesAStudent}/${out.bSeesATahsilat}`)
            out.step='success';out.success=true;save();await A.auth.signOut();await B.auth.signOut()
          }catch(e){out.error={message:e?.message||String(e),code:e?.code||null,details:e?.details||null,hint:e?.hint||null};save();console.error(out.step,out.error);process.exitCode=1}
          NODE
          code=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .demo-v1-e2e-diagnose.json
          git commit -m 'Demo V1 E2E teşhis sonucu' || true
          git push origin HEAD:demo-hazirlik
          exit $code
