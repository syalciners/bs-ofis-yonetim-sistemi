name: Build doğrulama

on:
  push:
    branches: ['v1-*', clean-v1-golden, saas-v1-core-schema-baseline-isolation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      VITE_PORTAL_URL: https://portal.example.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kritik iş kuralları
        run: npm run check:rules
      - name: SaaS kurulum manifesti, Core RPC ve provisioning sözleşmesi
        run: npm run check:saas-install
      - name: SaaS Core tam PostgreSQL provisioning testi
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create schema if not exists auth;
          create schema if not exists storage;

          create table auth.users (
            id uuid primary key,
            email text,
            email_confirmed_at timestamptz
          );
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;

          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects (
            id uuid default gen_random_uuid() primary key,
            bucket_id text,
            name text
          );
          alter table storage.objects enable row level security;
          create or replace function storage.foldername(name text)
          returns text[] language sql immutable as $$ select string_to_array(name,'/') $$;

          do $$ begin
            if not exists(select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists(select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists(select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if;
          end $$;
          SQL

          for file in \
            supabase/saas-v1-core/00a_core_tables.sql \
            supabase/saas-v1-core/00b_core_constraints.sql \
            supabase/saas-v1-core/00c_core_foreign_keys.sql \
            supabase/saas-v1-core/00d_core_indexes.sql \
            supabase/saas-v1-core/01_private_helpers.sql \
            supabase/saas-v1-core/02a_portal_rpc.sql \
            supabase/saas-v1-core/02b_management_rpc.sql \
            supabase/saas-v1-core/02c_notifications_assignments_rpc.sql \
            supabase/saas-v1-core/02d_finance_rpc.sql \
            supabase/saas-v1-core/02e_lessons_weekly_rpc.sql \
            supabase/saas-v1-core/02f_fixed_schedule_health_rpc.sql \
            supabase/saas-v1-core/03_core_seed.sql \
            supabase/saas-v1-core/04_core_security.sql \
            supabase/saas-v1-core/05_core_storage.sql \
            supabase/saas-v1-core/06_first_admin_bootstrap.sql
          do
            echo "Applying ${file}"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "${file}"
          done

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_tables integer;
            v_functions integer;
            v_rls integer;
            v_auth_exec integer;
            v_anon_exec integer;
            v_buckets integer;
            v_manager_count integer;
            v_second_failed boolean:=false;
            v_user uuid:='11111111-1111-4111-8111-111111111111'::uuid;
          begin
            select count(*) into v_tables
            from pg_tables
            where schemaname='public'
              and tablename=any(array[
                'aylik_snapshotlar','bildirim_okumalari','bildirimler','branslar','dersler','derslikler',
                'gider_kategorileri','giderler','haftalik_ders_uretimleri','hakedis_donemleri','kasa_hareketleri',
                'kasa_hesaplari','krediler','kullanici_profilleri','kurum_ayarlari','odevler','ogrenciler',
                'ogretmen_branslari','ogretmen_odemeleri','ogretmenler','portal_kullanicilari','rapor_talepleri',
                'sabit_ders_programi','sabit_program_istisnalari','tahsilatlar','tarifeler'
              ]);
            if v_tables<>26 then raise exception 'Core tablo sayısı 26 değil: %',v_tables; end if;

            select count(*) into v_functions
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname=any(array[
                'bildirim_okundu_v1','bildirim_okunmamis_sayisi_v1','bildirimlerim_v1','brans_kaydet_guvenli_v1',
                'ders_cakisma_kontrol_v1','ders_durumu_guncelle_guvenli_v1','ders_guncelle_guvenli_v1','ders_kaydet_guvenli_v1',
                'derslik_kaydet_guvenli_v1','drive_yukleme_yetkili_mi_v1','gider_guncelle_guvenli_v1','gider_iptal_guvenli_v1',
                'gider_kategorisi_kaydet_guvenli_v1','gider_kaydet_guvenli_v1','haftalik_ders_uretim_durumu_v3',
                'haftalik_dersleri_hazirla_guvenli_v6','haftalik_program_kontrol_oneri_v2','kasa_hesabi_kaydet_guvenli_v1',
                'kullanici_kendi_profilini_guncelle_guvenli_v1','kullanici_profili_guncelle_guvenli_v2',
                'kurum_ayarlari_guncelle_guvenli_v1','kurum_public_bilgisi_v1','odev_drive_eklerini_guncelle_guvenli_v1',
                'odev_durumu_guncelle_guvenli_v1','odev_eklerini_guncelle_guvenli_v1','odev_kaydet_guvenli_v1',
                'ogrenci_ekle_guvenli_v1','ogrenci_kaydet_guvenli_v2','ogrenci_sil_guvenli_v1','ogretmen_kaydet_guvenli_v5',
                'ogretmen_odeme_guncelle_guvenli_v1','ogretmen_odeme_iptal_guvenli_v1','ogretmen_odeme_kaydet_guvenli_v2',
                'portal_bugun_v2','portal_odevler_v2','portal_ogrenci_bugun_v1','portal_ogrenci_odev_tamamla_v1',
                'portal_oturum_bilgisi_v2','portal_program_v2','profil_fotografi_guncelle_guvenli_v1',
                'program_ayarlari_guncelle_guvenli_v1','program_saglik_kontrolu_v1','sabit_program_cakisma_kontrol_v1',
                'sabit_program_hafta_atla_guvenli_v1','sabit_program_kaydet_guvenli_v4','sabit_program_oneri_v1',
                'sabit_program_onizleme_v1','sabit_program_tek_sefer_tasi_guvenli_v1','sistem_saglik_kontrolu_v1',
                'tahsilat_guncelle_guvenli_v1','tahsilat_iptal_guvenli_v1','tahsilat_kaydet_guvenli_v1','tahsilat_sil_guvenli_v1'
              ]);
            if v_functions<>53 then raise exception 'Core public RPC sayısı 53 değil: %',v_functions; end if;

            select count(*) into v_rls
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind='r' and c.relrowsecurity
              and c.relname=any(array[
                'aylik_snapshotlar','bildirim_okumalari','bildirimler','branslar','dersler','derslikler',
                'gider_kategorileri','giderler','haftalik_ders_uretimleri','hakedis_donemleri','kasa_hareketleri',
                'kasa_hesaplari','krediler','kullanici_profilleri','kurum_ayarlari','odevler','ogrenciler',
                'ogretmen_branslari','ogretmen_odemeleri','ogretmenler','portal_kullanicilari','rapor_talepleri',
                'sabit_ders_programi','sabit_program_istisnalari','tahsilatlar','tarifeler'
              ]);
            if v_rls<>26 then raise exception 'RLS açık Core tablo sayısı 26 değil: %',v_rls; end if;

            if not has_table_privilege('authenticated','public.ogrenciler','SELECT') then
              raise exception 'authenticated ogrenciler SELECT yetkisi yok';
            end if;
            if has_table_privilege('authenticated','public.ogrenciler','INSERT')
               or has_table_privilege('authenticated','public.ogrenciler','UPDATE')
               or has_table_privilege('authenticated','public.ogrenciler','DELETE') then
              raise exception 'authenticated ogrenciler doğrudan DML yetkisi taşıyor';
            end if;
            if has_table_privilege('anon','public.ogrenciler','SELECT') then
              raise exception 'anon ogrenciler SELECT yetkisi taşıyor';
            end if;

            select count(*) into v_auth_exec
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname=any(array[
                'bildirim_okundu_v1','bildirim_okunmamis_sayisi_v1','bildirimlerim_v1','brans_kaydet_guvenli_v1',
                'ders_cakisma_kontrol_v1','ders_durumu_guncelle_guvenli_v1','ders_guncelle_guvenli_v1','ders_kaydet_guvenli_v1',
                'derslik_kaydet_guvenli_v1','drive_yukleme_yetkili_mi_v1','gider_guncelle_guvenli_v1','gider_iptal_guvenli_v1',
                'gider_kategorisi_kaydet_guvenli_v1','gider_kaydet_guvenli_v1','haftalik_ders_uretim_durumu_v3',
                'haftalik_dersleri_hazirla_guvenli_v6','haftalik_program_kontrol_oneri_v2','kasa_hesabi_kaydet_guvenli_v1',
                'kullanici_kendi_profilini_guncelle_guvenli_v1','kullanici_profili_guncelle_guvenli_v2',
                'kurum_ayarlari_guncelle_guvenli_v1','kurum_public_bilgisi_v1','odev_drive_eklerini_guncelle_guvenli_v1',
                'odev_durumu_guncelle_guvenli_v1','odev_eklerini_guncelle_guvenli_v1','odev_kaydet_guvenli_v1',
                'ogrenci_ekle_guvenli_v1','ogrenci_kaydet_guvenli_v2','ogrenci_sil_guvenli_v1','ogretmen_kaydet_guvenli_v5',
                'ogretmen_odeme_guncelle_guvenli_v1','ogretmen_odeme_iptal_guvenli_v1','ogretmen_odeme_kaydet_guvenli_v2',
                'portal_bugun_v2','portal_odevler_v2','portal_ogrenci_bugun_v1','portal_ogrenci_odev_tamamla_v1',
                'portal_oturum_bilgisi_v2','portal_program_v2','profil_fotografi_guncelle_guvenli_v1',
                'program_ayarlari_guncelle_guvenli_v1','program_saglik_kontrolu_v1','sabit_program_cakisma_kontrol_v1',
                'sabit_program_hafta_atla_guvenli_v1','sabit_program_kaydet_guvenli_v4','sabit_program_oneri_v1',
                'sabit_program_onizleme_v1','sabit_program_tek_sefer_tasi_guvenli_v1','sistem_saglik_kontrolu_v1',
                'tahsilat_guncelle_guvenli_v1','tahsilat_iptal_guvenli_v1','tahsilat_kaydet_guvenli_v1','tahsilat_sil_guvenli_v1'
              ])
              and has_function_privilege('authenticated',p.oid,'EXECUTE');
            if v_auth_exec<>53 then raise exception 'authenticated execute RPC sayısı 53 değil: %',v_auth_exec; end if;

            select count(*) into v_anon_exec
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname=any(array[
                'bildirim_okundu_v1','bildirim_okunmamis_sayisi_v1','bildirimlerim_v1','brans_kaydet_guvenli_v1',
                'ders_cakisma_kontrol_v1','ders_durumu_guncelle_guvenli_v1','ders_guncelle_guvenli_v1','ders_kaydet_guvenli_v1',
                'derslik_kaydet_guvenli_v1','drive_yukleme_yetkili_mi_v1','gider_guncelle_guvenli_v1','gider_iptal_guvenli_v1',
                'gider_kategorisi_kaydet_guvenli_v1','gider_kaydet_guvenli_v1','haftalik_ders_uretim_durumu_v3',
                'haftalik_dersleri_hazirla_guvenli_v6','haftalik_program_kontrol_oneri_v2','kasa_hesabi_kaydet_guvenli_v1',
                'kullanici_kendi_profilini_guncelle_guvenli_v1','kullanici_profili_guncelle_guvenli_v2',
                'kurum_ayarlari_guncelle_guvenli_v1','kurum_public_bilgisi_v1','odev_drive_eklerini_guncelle_guvenli_v1',
                'odev_durumu_guncelle_guvenli_v1','odev_eklerini_guncelle_guvenli_v1','odev_kaydet_guvenli_v1',
                'ogrenci_ekle_guvenli_v1','ogrenci_kaydet_guvenli_v2','ogrenci_sil_guvenli_v1','ogretmen_kaydet_guvenli_v5',
                'ogretmen_odeme_guncelle_guvenli_v1','ogretmen_odeme_iptal_guvenli_v1','ogretmen_odeme_kaydet_guvenli_v2',
                'portal_bugun_v2','portal_odevler_v2','portal_ogrenci_bugun_v1','portal_ogrenci_odev_tamamla_v1',
                'portal_oturum_bilgisi_v2','portal_program_v2','profil_fotografi_guncelle_guvenli_v1',
                'program_ayarlari_guncelle_guvenli_v1','program_saglik_kontrolu_v1','sabit_program_cakisma_kontrol_v1',
                'sabit_program_hafta_atla_guvenli_v1','sabit_program_kaydet_guvenli_v4','sabit_program_oneri_v1',
                'sabit_program_onizleme_v1','sabit_program_tek_sefer_tasi_guvenli_v1','sistem_saglik_kontrolu_v1',
                'tahsilat_guncelle_guvenli_v1','tahsilat_iptal_guvenli_v1','tahsilat_kaydet_guvenli_v1','tahsilat_sil_guvenli_v1'
              ])
              and has_function_privilege('anon',p.oid,'EXECUTE');
            if v_anon_exec<>1 then raise exception 'anon execute RPC sayısı 1 değil: %',v_anon_exec; end if;
            if not has_function_privilege('anon','public.kurum_public_bilgisi_v1()','EXECUTE') then
              raise exception 'anon kurum_public_bilgisi_v1 execute yetkisi yok';
            end if;

            select count(*) into v_buckets from storage.buckets
            where id=any(array['kurum-markasi','odev-ekleri','profil-fotograflari']);
            if v_buckets<>3 then raise exception 'Core bucket sayısı 3 değil: %',v_buckets; end if;
            if not (select public from storage.buckets where id='kurum-markasi') then raise exception 'kurum-markasi public değil'; end if;
            if (select public from storage.buckets where id='odev-ekleri') then raise exception 'odev-ekleri private değil'; end if;
            if (select public from storage.buckets where id='profil-fotograflari') then raise exception 'profil-fotograflari private değil'; end if;

            if has_function_privilege('anon','private.ilk_yonetici_bootstrap_v1(text,text)','EXECUTE')
               or has_function_privilege('authenticated','private.ilk_yonetici_bootstrap_v1(text,text)','EXECUTE') then
              raise exception 'Bootstrap client rollerine açık';
            end if;
            if not has_function_privilege('service_role','private.ilk_yonetici_bootstrap_v1(text,text)','EXECUTE') then
              raise exception 'Bootstrap service_role execute yetkisi yok';
            end if;

            insert into auth.users(id,email,email_confirmed_at)
            values(v_user,'pilot.admin@example.test',now());
            perform private.ilk_yonetici_bootstrap_v1('pilot.admin@example.test','Pilot Yönetici');
            select count(*) into v_manager_count
            from public.kullanici_profilleri
            where auth_user_id=v_user and rol='Yönetici' and aktif=true;
            if v_manager_count<>1 then raise exception 'İlk yönetici bootstrap profili oluşmadı'; end if;

            begin
              perform private.ilk_yonetici_bootstrap_v1('pilot.admin@example.test','Pilot Yönetici');
            exception when others then
              v_second_failed:=true;
            end;
            if not v_second_failed then raise exception 'Bootstrap ikinci kez çalışmayı reddetmedi'; end if;
          end $$;
          SQL
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: İptal ders Takvim kuralı
        run: node scripts/check-cancelled-calendar.mjs
      - name: Dinamik derslik Takvimi
        run: node scripts/check-daily-room-calendar.mjs
      - name: Öğretmenler UX kuralları
        run: node scripts/check-teachers-ux.mjs
      - name: Öğrenciler UX kuralları
        run: node scripts/check-students-ux.mjs
      - name: Raporlar UX kuralları
        run: node scripts/check-reports-ux.mjs
      - name: Detay ekranı UX kuralları
        run: node scripts/check-detail-ux.mjs
      - name: Akıllı Programlama kuralları
        run: node scripts/check-smart-scheduling.mjs
      - name: Ayarlar profil güvenliği
        run: node scripts/check-settings-ux.mjs
      - name: Program ayarları güvenliği
        run: node scripts/check-program-settings.mjs
      - name: Ödev ve WhatsApp kuralları
        run: node scripts/check-assignments-ux.mjs
      - name: Yönetici portal önizleme kuralları
        run: node scripts/check-manager-portal-preview.mjs
      - name: Yönetim uygulaması bağımlılıkları
        run: npm install --no-audit --no-fund
      - name: Yönetim uygulaması production build
        run: npm run build
      - name: Legacy Pages paketini repo köküne senkronla
        run: node scripts/sync-pages-root.mjs
      - name: Derlenmiş Pages paketini doğrula
        run: node scripts/check-published-pages.mjs
      - name: Portal bağımlılıkları
        working-directory: apps/bs-egitim-portali
        run: npm install --no-audit --no-fund
      - name: Portal production build
        working-directory: apps/bs-egitim-portali
        run: npm run build
      - name: Derlenmiş Pages paketini branch'e kaydet
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v1-')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Derlenmiş Pages paketi zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Derlenmiş Pages yayın paketini güncelle [skip ci]"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi