name: BS Soru Mimari brand preview

on:
  workflow_dispatch:
  push:
    branches: [bs-soru-mimari-v2-source]
    paths:
      - bs-soru-mimari-v23/brand/**
      - .github/workflows/bs-soru-mimari-brand-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_3m9L8toJmRGCAENDwfPFTUJq
      VERCEL_PROJECT_ID: prj_QmY56B8vnE1eWUOJBawN9IlTGWYV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      APP_DIR: bs-soru-mimari-v23/brand
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Marka sürümünü kur ve build doğrula
        id: build
        working-directory: bs-soru-mimari-v23/brand
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f public/bs-soru-mimari-mark.svg
          grep -q '#6D46F7' public/bs-soru-mimari-mark.svg
          grep -q '#FF7A45' public/bs-soru-mimari-mark.svg
          grep -q '#0F1530' public/bs-soru-mimari-mark.svg
          grep -q '#6D46F7' app/globals.css
          grep -q '#FF7A45' app/globals.css
          echo "V2.3.2 marka build doğrulaması başarılı."

      - name: Vercel token kontrolü
        id: token
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN tanımlı değil."; exit 1; }
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          test "$HTTP_CODE" = "200" || { echo "::warning::Token BS Soru Mimarı projesine erişemiyor (HTTP $HTTP_CODE); build sağlam, deploy atlandı."; exit 1; }

      - name: Vercel proje bağını hazırla
        if: steps.token.outcome == 'success'
        working-directory: bs-soru-mimari-v23/brand
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json

      - name: Vercel CLI kur
        if: steps.token.outcome == 'success'
        run: npm install --global vercel@latest

      - name: Preview deploy
        if: steps.token.outcome == 'success'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --cwd "$APP_DIR" --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "Preview: $URL"

      - name: Preview smoke testi
        if: steps.token.outcome == 'success'
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL --retry 5 --retry-delay 2 "$PREVIEW_URL")"
          [[ "$HTML" == *"BS Soru Mimarı"* ]] || { echo "::error::BS Soru Mimarı başlığı bulunamadı."; exit 1; }
          SVG="$(curl -fsSL --retry 5 --retry-delay 2 "$PREVIEW_URL/bs-soru-mimari-mark.svg")"
          [[ "$SVG" == *"#6D46F7"* && "$SVG" == *"#FF7A45"* ]] || { echo "::error::Yeni marka SVG'si preview'da bulunamadı."; exit 1; }
          echo "Brand preview smoke testi başarılı."

      - name: Preview sonucunu kaydet
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          TOKEN_HTTP: ${{ steps.token.outputs.http_code }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > .bs-soru-mimari-brand-preview-result.txt <<EOF
          run_id=$GITHUB_RUN_ID
          status=$JOB_STATUS
          build=${BUILD_OUTCOME:-}
          token=${TOKEN_OUTCOME:-}
          token_http=${TOKEN_HTTP:-}
          deploy=${DEPLOY_OUTCOME:-}
          smoke=${SMOKE_OUTCOME:-}
          preview_url=${PREVIEW_URL:-}
          commit=$GITHUB_SHA
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bs-soru-mimari-brand-preview-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "BS Soru Mimarı marka preview sonucunu kaydet [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
