name: Build doğrulama

on:
  push:
    branches: [main, v1-temiz-gelistirme]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/manifest.webmanifest
