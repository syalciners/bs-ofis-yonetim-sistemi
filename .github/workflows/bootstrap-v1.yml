name: Bootstrap clean V1

on:
  push:
    branches: [v1-temiz-gelistirme]
    paths:
      - ".github/workflows/bootstrap-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble clean V1 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/source.fix.00a \
            .bootstrap/source.fix.00b \
            .bootstrap/source.part.01 \
            .bootstrap/rest.part.00 \
            .bootstrap/rest.part.01 \
            .bootstrap/rest.part.02 \
            .bootstrap/rest.part.03 \
            .bootstrap/rest.part.04 \
            .bootstrap/rest.part.05 \
            .bootstrap/rest.fix.06 \
            .bootstrap/rest.part.07 \
            .bootstrap/rest.part.08 \
            .bootstrap/rest.part.09 \
            .bootstrap/rest.part.10 \
            .bootstrap/rest.part.11 \
            .bootstrap/rest.part.12 \
            .bootstrap/rest.part.13 \
            .bootstrap/rest.part.14 \
            > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          unzip -tq /tmp/source.zip
          mkdir -p /tmp/v1
          unzip -q /tmp/source.zip -d /tmp/v1

      - name: Copy supplied BS brand icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v1/public
          for f in apple-touch-icon.png bs-app-icon-192.png bs-app-icon-512.png favicon-16x16.png favicon-32x32.png favicon-48x48.png; do
            git show origin/v0-9-eski-prototip-arsiv:$f > "/tmp/v1/public/$f"
          done

      - name: Replace development branch with clean V1 source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-v1.yml /tmp/bootstrap-v1.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v1/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap-v1.yml .github/workflows/bootstrap-v1.yml
          git config user.name "BS Ofis Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "V1: temiz React PWA kaynak yapısını kur"
          git push origin HEAD:v1-temiz-gelistirme

# clean source bootstrap, workflow preserved intentionally
