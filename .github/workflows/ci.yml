name: Build doğrulama

on:
  push:
    branches: ['v1-*', clean-v1-golden]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canlı Pages ana commitini doğrula
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: a765d7fb558db61600edc95e564cb211c94e0f92
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            data="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            status="$(printf '%s' "$data" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            commit="$(printf '%s' "$data" | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))')"
            echo "Pages: status=${status} commit=${commit}"
            if [ "$status" = "built" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              printf 'BUILT %s\n' "$commit" > scripts/_tmp_pages_live_ok.txt
              exit 0
            fi
            sleep 10
          done
          echo "Beklenen Pages yayını doğrulanamadı." >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kritik iş kuralları
        run: npm run check:rules
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: İptal ders Takvim kuralı
        run: node scripts/check-cancelled-calendar.mjs
      - name: Beş sütunlu derslik Takvimi
        run: node scripts/check-daily-room-calendar.mjs
      - name: Öğretmenler UX kuralları
        run: node scripts/check-teachers-ux.mjs
      - name: Öğrenciler UX kuralları
        run: node scripts/check-students-ux.mjs
      - name: Raporlar UX kuralları
        run: node scripts/check-reports-ux.mjs
      - name: Detay ekranı UX kuralları
        run: node scripts/check-detail-ux.mjs
      - name: Akıllı Programlama kuralları
        run: node scripts/check-smart-scheduling.mjs
      - name: Ayarlar profil güvenliği
        run: node scripts/check-settings-ux.mjs
      - name: Ödev ve WhatsApp kuralları
        run: node scripts/check-assignments-ux.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Legacy Pages paketini repo köküne senkronla
        run: node scripts/sync-pages-root.mjs
      - name: Derlenmiş Pages paketini doğrula
        run: node scripts/check-published-pages.mjs
      - name: Derlenmiş Pages paketini branch'e kaydet
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v1-')
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Derlenmiş Pages paketi zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canlı Pages doğrulaması başarılı [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
