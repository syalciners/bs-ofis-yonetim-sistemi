name: Geçici Program üst yapı doğrulama

on:
  push:
    branches: ['v1-program-ust-yapi-standart']
    paths-ignore:
      - 'scripts/_tmp_program_verify_ok.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Takvim UX kuralları
        run: node scripts/check-calendar-ux.mjs
      - name: Günlük derslik takvimi regresyonu
        run: node scripts/check-daily-room-calendar.mjs
      - name: Paketleri kur
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Başarı işaretini kaydet
        shell: bash
        run: |
          set -euo pipefail
          printf 'OK %s\n' "$GITHUB_SHA" > scripts/_tmp_program_verify_ok.txt
          git add scripts/_tmp_program_verify_ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Program üst yapı doğrulaması başarılı [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
