<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>BS Ofis Yönetim Sistemi</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #dbeafe 0%,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #f8fafc 0%,
          #eff6ff 100%
        );

      color: #0f172a;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .giris-karti {
      width: 100%;
      max-width: 430px;

      background: rgba(255,255,255,0.96);

      border: 1px solid #e2e8f0;
      border-radius: 24px;

      padding: 42px 36px;

      box-shadow:
        0 24px 60px rgba(15,23,42,0.10);
    }

    .logo-alani {
      text-align: center;
      margin-bottom: 34px;
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #2563eb;
      color: white;

      font-size: 27px;
      font-weight: 800;

      box-shadow:
        0 12px 28px rgba(37,99,235,0.28);
    }

    h1 {
      font-size: 25px;
      line-height: 1.25;
      font-weight: 750;
      color: #0f172a;
    }

    .alt-baslik {
      margin-top: 9px;

      font-size: 14px;
      line-height: 1.5;

      color: #64748b;
    }

    .google-buton {
      width: 100%;
      height: 56px;

      border: 1px solid #cbd5e1;
      border-radius: 13px;

      background: #ffffff;
      color: #1e293b;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(15,23,42,0.06);

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.15s;
    }

    .google-buton:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .google-buton:active {
      transform: scale(0.99);
    }

    .google-buton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .google-logo {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    .durum {
      display: none;

      margin-top: 18px;
      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;

      text-align: center;
    }

    .durum.hata {
      display: block;

      background: #fef2f2;
      color: #b91c1c;

      border: 1px solid #fecaca;
    }

    .durum.bilgi {
      display: block;

      background: #eff6ff;
      color: #1d4ed8;

      border: 1px solid #bfdbfe;
    }

    .basari-alani {
      display: none;
      text-align: center;
    }

    .basari-ikon {
      width: 64px;
      height: 64px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #dcfce7;
      color: #15803d;

      font-size: 30px;
      font-weight: 700;
    }

    .basari-baslik {
      font-size: 23px;
      font-weight: 750;

      color: #0f172a;
    }

    .kullanici-adi {
      margin-top: 10px;

      font-size: 17px;
      font-weight: 650;

      color: #2563eb;
    }

    .rol {
      margin-top: 5px;

      font-size: 14px;
      color: #64748b;
    }

    .basari-aciklama {
      margin-top: 20px;
      padding: 14px;

      border-radius: 12px;

      background: #f8fafc;

      font-size: 13px;
      line-height: 1.5;

      color: #475569;
    }

    .cikis-buton {
      width: 100%;
      height: 52px;

      margin-top: 22px;

      border: none;
      border-radius: 12px;

      background: #f1f5f9;
      color: #334155;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .cikis-buton:hover {
      background: #e2e8f0;
    }

    .alt-bilgi {
      margin-top: 30px;

      text-align: center;

      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .giris-karti {
        padding: 34px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="giris-karti">

    <div id="girisAlani">

      <div class="logo-alani">

        <div class="logo">
          BS
        </div>

        <h1>
          BS Ofis Yönetim Sistemi
        </h1>

        <p class="alt-baslik">
          Yönetim paneline Google hesabınızla giriş yapın.
        </p>

      </div>

      <button
        class="google-buton"
        type="button"
        id="googleGirisButon"
      >

        <svg
          class="google-logo"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="#4285F4"
            d="M21.35 12.19c0-.64-.06-1.25-.16-1.84H12v3.48h5.25a4.49 4.49 0 0 1-1.95 2.94v2.26h3.16c1.85-1.7 2.89-4.21 2.89-6.84z"
          />
          <path
            fill="#34A853"
            d="M12 21.73c2.64 0 4.86-.88 6.48-2.38l-3.16-2.45c-.88.59-2 .94-3.32.94-2.55 0-4.71-1.72-5.48-4.03H3.26v2.53A9.79 9.79 0 0 0 12 21.73z"
          />
          <path
            fill="#FBBC05"
            d="M6.52 13.81A5.88 5.88 0 0 1 6.21 12c0-.63.11-1.24.31-1.81V7.66H3.26A9.75 9.75 0 0 0 2.21 12c0 1.57.38 3.05 1.05 4.34l3.26-2.53z"
          />
          <path
            fill="#EA4335"
            d="M12 6.16c1.44 0 2.73.5 3.74 1.47l2.8-2.8C16.85 3.25 14.64 2.27 12 2.27a9.79 9.79 0 0 0-8.74 5.39l3.26 2.53C7.29 7.88 9.45 6.16 12 6.16z"
          />
        </svg>

        <span id="googleButonMetni">
          Google ile Giriş Yap
        </span>

      </button>

      <div
        class="durum"
        id="durum"
      ></div>

    </div>


    <div
      class="basari-alani"
      id="basariAlani"
    >

      <div class="basari-ikon">
        ✓
      </div>

      <div class="basari-baslik">
        Giriş Başarılı
      </div>

      <div
        class="kullanici-adi"
        id="kullaniciAdi"
      ></div>

      <div
        class="rol"
        id="kullaniciRol"
      ></div>

      <div class="basari-aciklama">
        Google hesabınız doğrulandı ve
        BS Ofis yönetici yetkiniz kontrol edildi.
        <br><br>
        Ana yönetim paneli bir sonraki aşamada
        bu ekrana bağlanacak.
      </div>

      <button
        class="cikis-buton"
        type="button"
        id="cikisButon"
      >
        Çıkış Yap
      </button>

    </div>


    <div class="alt-bilgi">
      BS Ofis • Güvenli Yönetim Paneli
    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    const SUPABASE_URL =
      "https://igmtuouhdozkgwmdxlme.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_scFk1bnw1-VCw_ZQrfc7Mw_N518OvBf";

    const UYGULAMA_URL =
      "https://syalciners.github.io/bs-ofis-yonetim-sistemi/";


    const bsSupabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const girisAlani =
      document.getElementById("girisAlani");

    const basariAlani =
      document.getElementById("basariAlani");

    const googleGirisButon =
      document.getElementById("googleGirisButon");

    const googleButonMetni =
      document.getElementById("googleButonMetni");

    const durum =
      document.getElementById("durum");

    const kullaniciAdi =
      document.getElementById("kullaniciAdi");

    const kullaniciRol =
      document.getElementById("kullaniciRol");

    const cikisButon =
      document.getElementById("cikisButon");


    function durumGoster(
      mesaj,
      tur = "bilgi"
    ) {

      durum.textContent = mesaj;
      durum.className = "durum " + tur;

    }


    function durumTemizle() {

      durum.textContent = "";
      durum.className = "durum";

    }


    function girisEkraniniGoster() {

      basariAlani.style.display = "none";
      girisAlani.style.display = "block";

      googleGirisButon.disabled = false;

      googleButonMetni.textContent =
        "Google ile Giriş Yap";

    }


    function basariEkraniniGoster(
      profil
    ) {

      girisAlani.style.display = "none";
      basariAlani.style.display = "block";

      kullaniciAdi.textContent =
        profil.ad_soyad;

      kullaniciRol.textContent =
        profil.rol;

    }


    async function kullaniciYetkisiniKontrolEt(
      user
    ) {

      const {
        data,
        error
      } =
        await bsSupabase
          .from("kullanici_profilleri")
          .select(
            "ad_soyad, rol, aktif"
          )
          .eq(
            "auth_user_id",
            user.id
          )
          .single();


      if (error || !data) {

        throw new Error(
          "Bu Google hesabı için geçerli bir BS Ofis kullanıcı profili bulunamadı."
        );

      }


      if (
        data.aktif !== true ||
        data.rol !== "Yönetici"
      ) {

        throw new Error(
          "Bu Google hesabı yönetim paneline erişim yetkisine sahip değil."
        );

      }


      return data;

    }


    async function oturumuDogrula(
      user
    ) {

      try {

        const profil =
          await kullaniciYetkisiniKontrolEt(
            user
          );

        durumTemizle();

        basariEkraniniGoster(
          profil
        );

      } catch (error) {

        await bsSupabase.auth.signOut();

        girisEkraniniGoster();

        durumGoster(
          error.message,
          "hata"
        );

      }

    }


    googleGirisButon.addEventListener(
      "click",
      async function () {

        durumTemizle();

        googleGirisButon.disabled = true;

        googleButonMetni.textContent =
          "Google açılıyor...";


        const {
          error
        } =
          await bsSupabase.auth
            .signInWithOAuth({
              provider: "google",

              options: {
                redirectTo: UYGULAMA_URL,

                queryParams: {
                  access_type: "offline",
                  prompt: "select_account"
                }
              }
            });


        if (error) {

          googleGirisButon.disabled = false;

          googleButonMetni.textContent =
            "Google ile Giriş Yap";

          durumGoster(
            "Google ile giriş başlatılamadı.",
            "hata"
          );

        }

      }
    );


    cikisButon.addEventListener(
      "click",
      async function () {

        await bsSupabase.auth.signOut();

        girisEkraniniGoster();

        durumTemizle();

      }
    );


    async function mevcutOturumuKontrolEt() {

      const {
        data,
        error
      } =
        await bsSupabase.auth.getSession();


      if (
        error ||
        !data ||
        !data.session ||
        !data.session.user
      ) {

        girisEkraniniGoster();

        return;

      }


      await oturumuDogrula(
        data.session.user
      );

    }


    bsSupabase.auth.onAuthStateChange(
      async function (
        event,
        session
      ) {

        if (
          event === "SIGNED_IN" &&
          session &&
          session.user
        ) {

          await oturumuDogrula(
            session.user
          );

        }

      }
    );


    mevcutOturumuKontrolEt();

  </script>

</body>
</html>
