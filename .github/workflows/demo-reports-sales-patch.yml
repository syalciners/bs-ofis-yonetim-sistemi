name: Demo Raporlar satış terminolojisi

on:
  push:
    branches: [demo-satis-audit-raporlar]
    paths:
      - .github/workflows/demo-reports-sales-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapor ve PDF terminolojisini eşitle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ['src/pages/ReportsPage.tsx', 'src/services/institutionManagementPdfService.ts']:
              path = Path(filename)
              text = path.read_text()
              count = text.count('Öğretmen Borcu')
              if count != 1:
                  raise SystemExit(f'{filename}: beklenen 1 Öğretmen Borcu, bulunan {count}')
              path.write_text(text.replace('Öğretmen Borcu', 'Ödenecek Hakediş', 1))
          PY
      - name: Yalnız rapor dosyalarını kaydet
        shell: bash
        run: |
          set -euo pipefail
          git add src/pages/ReportsPage.tsx src/services/institutionManagementPdfService.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Demo raporlarda hakediş terminolojisini düzelt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
