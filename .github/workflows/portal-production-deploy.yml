name: Portal production deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .portal-production-deploy-trigger.txt

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_3m9L8toJmRGCAENDwfPFTUJq
      VERCEL_PROJECT_ID: prj_WTCzIweta6c9XIpQT8pKGC9xBPrB
      VERCEL_TOKEN: ${{ secrets.VERCEL_PORTAL_TOKEN }}
      EXPECTED_SUPABASE_URL: https://igmtuouhdozkgwmdxlme.supabase.co
      EXPECTED_PUBLISHABLE_KEY_SHA256: e3566d5568f13248e849e49bb28cfc5b92cba825b96bec80f94392cc5b66d213
      PORTAL_DIR: apps/bs-egitim-portali
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vercel portal token kontrolü
        id: token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_PORTAL_TOKEN GitHub Actions secret tanımlı değil. Portal production deploy yapılmadı."
            exit 1
          fi

      - name: Portal Supabase bağlantısını doğrula
        id: source_guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const text = fs.readFileSync('apps/bs-egitim-portali/src/supabase.ts', 'utf8')
          const url = text.match(/SUPABASE_URL\s*=\s*['"]([^'"]+)['"]/)?.[1] || ''
          const key = text.match(/SUPABASE_KEY\s*=\s*['"]([^'"]+)['"]/)?.[1] || ''
          const keyHash = crypto.createHash('sha256').update(key).digest('hex')
          if (url !== process.env.EXPECTED_SUPABASE_URL) {
            console.error('GÜVENLİK ENGELİ: Portal ana Supabase projesine bağlı değil.')
            process.exit(1)
          }
          if (!key || keyHash !== process.env.EXPECTED_PUBLISHABLE_KEY_SHA256) {
            console.error('GÜVENLİK ENGELİ: Portal publishable key beklenen ana proje anahtarıyla eşleşmiyor.')
            process.exit(1)
          }
          if (text.includes('pparlcdctnivmpiofuvz')) {
            console.error('GÜVENLİK ENGELİ: Demo Supabase ref portal kaynağında bulundu.')
            process.exit(1)
          }
          console.log('Portal ana Supabase bağlantısı doğrulandı.')
          NODE

      - name: Portal bağımlılıklarını kur ve build doğrula
        id: portal_build
        working-directory: apps/bs-egitim-portali
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prebuilt Vercel paketini hazırla
        id: prebuilt
        working-directory: apps/bs-egitim-portali
        shell: bash
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::Portal dist klasörü bulunamadı."; exit 1; }
          rm -rf .vercel
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          printf '%s\n' '{"version":3}' > .vercel/output/config.json
          node <<'NODE'
          const fs = require('fs')
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID
          }))
          NODE

      - name: Prebuilt paket güvenlik kontrolü
        id: artifact_guard
        working-directory: apps/bs-egitim-portali
        shell: bash
        run: |
          set -euo pipefail
          STATIC_DIR=".vercel/output/static"
          test -f ".vercel/output/config.json" || { echo "::error::Build Output config.json bulunamadı."; exit 1; }
          test -f "$STATIC_DIR/index.html" || { echo "::error::Portal production index.html bulunamadı."; exit 1; }
          grep -R -F -q "$EXPECTED_SUPABASE_URL" "$STATIC_DIR" || { echo "::error::Ana Supabase URL production paketinde bulunamadı."; exit 1; }
          if grep -R -F -q "pparlcdctnivmpiofuvz" "$STATIC_DIR"; then
            echo "::error::Demo Supabase ref production portal paketine sızdı."
            exit 1
          fi
          grep -R -F -q "bildirimlerim_v1" "$STATIC_DIR" || { echo "::error::Bildirim Merkezi kodu production paketinde bulunamadı."; exit 1; }
          INDEX_JS="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' "$STATIC_DIR/index.html" | head -n 1)"
          INDEX_CSS="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.css' "$STATIC_DIR/index.html" | head -n 1)"
          test -n "$INDEX_JS" || { echo "::error::Portal production index JS bulunamadı."; exit 1; }
          test -n "$INDEX_CSS" || { echo "::error::Portal production index CSS bulunamadı."; exit 1; }
          echo "EXPECTED_INDEX_JS=$INDEX_JS" >> "$GITHUB_ENV"
          echo "EXPECTED_INDEX_CSS=$INDEX_CSS" >> "$GITHUB_ENV"
          echo "Prebuilt portal paketi doğrulandı: $INDEX_JS / $INDEX_CSS"

      - name: Portal token proje erişimini doğrula
        id: project_access
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::VERCEL_PORTAL_TOKEN portal projesine erişemiyor (HTTP $HTTP_CODE). Deploy yapılmadı."
            exit 1
          fi
          echo "Portal proje erişimi doğrulandı."

      - name: Vercel CLI kur
        id: cli
        run: npm install --global vercel@latest

      - name: BS Eğitim Portalı production deploy
        id: deploy
        run: vercel deploy --cwd "$PORTAL_DIR" --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Canlı portal smoke testi
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://bs-egitim-portali.vercel.app"
          MATCHED=0
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            INDEX="$(curl -fsSL --retry 2 --retry-delay 1 "$BASE_URL/?deploy_check=${GITHUB_RUN_ID}-${ATTEMPT}")"
            if [[ "$INDEX" == *"$EXPECTED_INDEX_JS"* && "$INDEX" == *"$EXPECTED_INDEX_CSS"* ]]; then
              MATCHED=1
              break
            fi
            sleep 2
          done
          if [ "$MATCHED" -ne 1 ]; then
            echo "::error::Canlı portal alias yeni production assetlerini göstermedi."
            exit 1
          fi
          JS="$(curl -fsSL --retry 2 "$BASE_URL/$EXPECTED_INDEX_JS?deploy_check=$GITHUB_RUN_ID")"
          if [[ "$JS" != *"bildirimlerim_v1"* ]]; then
            echo "::error::Canlı portal JS içinde Bildirim Merkezi bulunamadı."
            exit 1
          fi
          curl -fsSL --retry 2 "$BASE_URL/$EXPECTED_INDEX_CSS?deploy_check=$GITHUB_RUN_ID" >/dev/null
          echo "Canlı BS Eğitim Portalı smoke testi başarılı."

      - name: Deploy sonucunu kaydet
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          SOURCE_GUARD_OUTCOME: ${{ steps.source_guard.outcome }}
          PORTAL_BUILD_OUTCOME: ${{ steps.portal_build.outcome }}
          PREBUILT_OUTCOME: ${{ steps.prebuilt.outcome }}
          ARTIFACT_GUARD_OUTCOME: ${{ steps.artifact_guard.outcome }}
          PROJECT_ACCESS_OUTCOME: ${{ steps.project_access.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > .portal-production-deploy-result.txt <<EOF
          run_id=$GITHUB_RUN_ID
          job_status=$JOB_STATUS
          token=$TOKEN_OUTCOME
          source_guard=$SOURCE_GUARD_OUTCOME
          portal_build=$PORTAL_BUILD_OUTCOME
          prebuilt=$PREBUILT_OUTCOME
          artifact_guard=$ARTIFACT_GUARD_OUTCOME
          project_access=$PROJECT_ACCESS_OUTCOME
          cli=$CLI_OUTCOME
          deploy=$DEPLOY_OUTCOME
          smoke=$SMOKE_OUTCOME
          expected_index_js=${EXPECTED_INDEX_JS:-}
          expected_index_css=${EXPECTED_INDEX_CSS:-}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .portal-production-deploy-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Portal production deploy sonucunu kaydet [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
